<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Registration</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .error {
            color: red;
        }

        .error-border {
            border: 1px solid red;
        }

        .main-content {
            display: flex;
        }

        .content {
            flex: 1;
            padding: 20px;
        }

        .sidebar {
            width: 200px;
            padding: 20px;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        form label, form input, form select {
            margin-bottom: 10px;
            width: 100%;
        }

        form input[type="submit"], form input[type="reset"] {
            width: auto;
        }
    </style>
</head>
<body>
    
    <header>
        <div class="hospital-info">
            <img src="https://images.pexels.com/photos/6129115/pexels-photo-6129115.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2" alt="Upendo Hospital Logo" class="logo">
            <h1>Upendo Hospital</h1>
        </div>
        <nav>
            <ul>
                <li><a href="{{ url_for('home') }}">Home</a></li>
                <li><a href="{{ url_for('registration') }}">Registration</a></li>
                <li><a href="{{ url_for('records') }}">Records</a></li>
                <li><a href="#">About Us</a></li>
                <li><a href="#">Contacts</a></li>
            </ul>
        </nav>
    </header>
    <section class="main-content" >
        <div class="content" id="forms">
            <div>                
                <form action="{{ url_for('registration') }}" method="POST" id="registrationForm">
                    <h2>Patient Registration Form</h2>
                    <label for="name">First Name:</label>
                    <input type="text" id="name" name="name" required>
                    <span class="error" id="nameError"></span><br>

                    <label for="last_name">Last Name:</label>
                    <input type="text" id="last_name" name="last_name" required>
                    <span class="error" id="lastNameError"></span><br>

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                    <span class="error" id="emailError"></span><br>

                    <label for="gender">Gender:</label>
                    <select id="gender" name="gender" required>
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Bi-sexual">Bi-sexual</option>
                    </select>
                    <span class="error" id="genderError"></span><br>

                    <label for="county">County:</label>
                    <select id="county" name="county" required>
                        <option value="">Select County</option>
                        <option value="Baringo">Baringo</option>
                        <option value="Bomet">Bomet</option>
                        <option value="Bungoma">Bungoma</option>
                        <option value="Busia">Busia</option>
                        <option value="Elgeyo-Marakwet">Elgeyo-Marakwet</option>
                        <option value="Embu">Embu</option>
                        <option value="Garissa">Garissa</option>
                        <option value="Homa Bay">Homa Bay</option>
                        <option value="Isiolo">Isiolo</option>
                        <option value="Kajiado">Kajiado</option>
                        <option value="Kakamega">Kakamega</option>
                        <option value="Kericho">Kericho</option>
                        <option value="Kiambu">Kiambu</option>
                        <option value="Kilifi">Kilifi</option>
                        <option value="Kirinyaga">Kirinyaga</option>
                        <option value="Kisii">Kisii</option>
                        <option value="Kisumu">Kisumu</option>
                        <option value="Kitui">Kitui</option>
                        <option value="Kwale">Kwale</option>
                        <option value="Laikipia">Laikipia</option>
                        <option value="Lamu">Lamu</option>
                        <option value="Machakos">Machakos</option>
                        <option value="Makueni">Makueni</option>
                        <option value="Mandera">Mandera</option>
                        <option value="Marsabit">Marsabit</option>
                        <option value="Meru">Meru</option>
                        <option value="Migori">Migori</option>
                        <option value="Mombasa">Mombasa</option>
                        <option value="Murang'a">Murang'a</option>
                        <option value="Nairobi">Nairobi</option>
                        <option value="Nakuru">Nakuru</option>
                        <option value="Nandi">Nandi</option>
                        <option value="Narok">Narok</option>
                        <option value="Nyamira">Nyamira</option>
                        <option value="Nyandarua">Nyandarua</option>
                        <option value="Nyeri">Nyeri</option>
                        <option value="Samburu">Samburu</option>
                        <option value="Siaya">Siaya</option>
                        <option value="Taita-Taveta">Taita-Taveta</option>
                        <option value="Tana River">Tana River</option>
                        <option value="Tharaka-Nithi">Tharaka-Nithi</option>
                        <option value="Trans Nzoia">Trans Nzoia</option>
                        <option value="Turkana">Turkana</option>
                        <option value="Uasin Gishu">Uasin Gishu</option>
                        <option value="Vihiga">Vihiga</option>
                        <option value="Wajir">Wajir</option>
                        <option value="West Pokot">West Pokot</option>
                    </select>
                    
                    <span class="error" id="countyError"></span><br>

                    <label for="age">Age:</label>
                    <input type="number" id="age" name="age" required>
                    <span class="error" id="ageError"></span><br>

                    <input type="submit" value="Register">
                    <input type="reset" value="Reset">
                </form>
            </div>
            <div>                
                <form action="{{ url_for('registration') }}" method="POST" id="nextOfKinForm">
                    <h2>Next of Kin Registration Form</h2>
                    <label for="patient_id">Patient ID:</label>
                    <input type="text" id="patient_id" name="patient_id" required>
                    <span class="error" id="patientIdError"></span><br>

                    <label for="first_name">First Name:</label>
                    <input type="text" id="first_name" name="first_name" required>
                    <span class="error" id="firstNameError"></span><br>

                    <label for="surname">Surname:</label>
                    <input type="text" id="surname" name="surname" required>
                    <span class="error" id="surnameError"></span><br>

                    <label for="relationship">Relationship:</label>
                    <input type="text" id="relationship" name="relationship" required>
                    <span class="error" id="relationshipError"></span><br>

                    <input type="submit" value="Register">
                    <input type="reset" value="Reset">
                </form>
            </div>
        </div>
    </section>
    <footer>
        <p>&copy; 2025 Timon - SCS3/2266/2023</p>
    </footer>


</body>
</html>
